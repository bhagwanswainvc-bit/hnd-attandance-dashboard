<style>
  :root {
    --bg: #f5f7fb;
    --accent: #0b63d6;
    --muted: #64748b;
    --success: #16a34a;
    --danger: #ef4444;
    --glass-bg: rgba(255, 255, 255, 0.7);
    --glass-border: 1px solid rgba(255, 255, 255, 0.8);
    --glass-shadow: 0 8px 32px rgba(2, 6, 23, 0.05);
    --btn-radius: 12px;
    --btn-padding: 10px 16px;
    --sidebar-width: 260px;
    --sidebar-collapsed: 72px;
  }

  html, body {
    height: 100%; margin: 0; font-family: Inter, Roboto, Arial, sans-serif;
    background: var(--bg); color: #111827;
  }
  
  /* Removed the body.login-bg::before blur overlay so the image can be seen clearly */

  .app { display: flex; height: 100vh; overflow: hidden; }

  /* Sidebar */
  .sidebar {
    width: var(--sidebar-width); background: linear-gradient(180deg, #0b63d6, #0a58c0);
    color: #fff; padding: 18px; box-sizing: border-box; transition: width .25s ease;
    position: relative; display: flex; flex-direction: column;
  }
  .sidebar.hidden { display: none; }
  .sidebar.collapsed { width: var(--sidebar-collapsed); }
  .sidebar .logo { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 18px; padding-top: 6px; width: 100%; }
  
  /* Proper sidebar logo sizing */
  .sidebar .logo img { width: 100%; max-width: 140px; height: auto; border-radius: 10px; object-fit: contain; box-shadow: 0 6px 18px rgba(2,6,23,0.08); background: rgba(255,255,255,0.03); padding: 6px; }
  
  .nav { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; align-items: center; }
  .nav a { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px; border-radius: 12px; color: #e6eefc; text-decoration: none; font-size: 12px; width: 100%; box-sizing: border-box; transition: all .2s; }
  .nav a .icon { width: 36px; height: 36px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 18px; backdrop-filter: blur(4px); }
  .nav a .label { font-size: 12px; color: rgba(255,255,255,0.92); text-align: center; }
  .nav a:hover { background: rgba(255,255,255,0.05); }
  .nav a.active { background: rgba(255,255,255,0.15); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2); backdrop-filter: blur(8px); }
  .sidebar .toggle-btn { position: absolute; right: -18px; top: 12px; width: 36px; height: 36px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(2,6,23,0.12); cursor: pointer; transition: transform .2s; z-index: 10; color: #0b63d6; font-weight: bold;}
  .sidebar.collapsed .label { display: none; }
  .sidebar.collapsed .nav { align-items: center; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: auto; }
  
  /* Topbar */
  .topbar { height: 64px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-bottom: var(--glass-border); position: sticky; top: 0; z-index: 6; }
  .topbar.hidden { display: none; }

  /* Glassmorphism Cards & Containers */
  .card, .table, .matrix, .count-badge, .profile-dropdown {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: var(--glass-border);
    border-radius: 16px;
    box-shadow: var(--glass-shadow);
  }

  /* Beautiful Inputs & Selects */
  .input, select, input[type="text"], input[type="email"], input[type="password"], input[type="date"] {
    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(226, 232, 240, 0.8);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
    color: #1e293b;
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
    transition: all 0.3s ease;
    box-sizing: border-box;
  }
  .input:focus, select:focus, input:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(11, 99, 214, 0.15);
  }

  /* Modern Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(135deg, #0b63d6, #094eb0);
    color: #fff; border: none; padding: var(--btn-padding); border-radius: var(--btn-radius);
    font-weight: 600; font-size: 14px; cursor: pointer;
    box-shadow: 0 4px 15px rgba(11, 99, 214, 0.3);
    transition: all 0.2s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(11, 99, 214, 0.4); }
  .btn:active { transform: translateY(1px); box-shadow: 0 2px 10px rgba(11, 99, 214, 0.3); }
  
  .btn.secondary { 
    background: rgba(255, 255, 255, 0.8); color: var(--accent); 
    border: 1px solid rgba(11, 99, 214, 0.2); box-shadow: 0 2px 6px rgba(0,0,0,0.05); 
    backdrop-filter: blur(4px);
  }
  .btn.secondary:hover { background: #fff; border-color: var(--accent); }
  
  .btn.danger { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
  .btn.small { padding: 6px 12px; font-size: 13px; border-radius: 8px; }

  /* Layout elements */
  .header-counts { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 18px; position: sticky; top: 64px; z-index: 5; box-sizing: border-box; width: 100%; }
  .count-badge { padding: 14px 18px; min-width: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; margin: 0 6px; }
  .count-badge .label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .count-badge .value { font-weight: 700; font-size: 22px; color: var(--accent); }
  
  .container { padding: 18px; display: flex; flex-direction: column; gap: 18px; }
  .card { padding: 16px; min-width: 180px; flex: 1; }
  .card .title { font-weight: 700; margin-bottom: 12px; font-size: 15px; color: #1e293b; }
  .small { font-size: 12px; color: var(--muted); }

  /* Login Form */
  .login-wrap { display: flex; align-items: center; justify-content: center; height: calc(100vh - 64px); position: relative; z-index: 2; }
  .login-card { width: 420px; padding: 32px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.9); border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
  .login-card h2 { margin: 0 0 8px 0; color: #1e293b; }
  .login-card label { font-size: 13px; color: var(--muted); display: block; margin-top: 12px; font-weight: 500; }
  .login-card input { margin-top: 6px; }
  .login-actions { display: flex; gap: 10px; align-items: center; margin-top: 20px; }
  .login-footer { margin-top: 16px; font-size: 13px; color: var(--muted); text-align: center; }

  /* Grid & Tables */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-row { display: flex; flex-direction: column; gap: 6px; }
  .full-width { grid-column: 1 / -1; }
  .table { padding: 16px; overflow: auto; }
  .matrix { padding: 16px; overflow: auto; }
  table.matrix-table { border-collapse: collapse; width: 100%; background: #fff; border-radius: 8px; overflow: hidden;}
  table.matrix-table th, table.matrix-table td { border: 1px solid #eef2ff; padding: 8px; text-align: center; font-size: 12px; }
  .matrix-sunday-header { background: #fff6f6 !important; color: #b91c1c !important; font-weight: 700; }
  .matrix-sunday-cell { color: #b91c1c !important; background: #fff7f7 !important; }

  /* Calendar */
  .calendar-wrap { display: flex; flex-direction: column; gap: 12px; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .cal-cell { background: rgba(255,255,255,0.6); padding: 10px; border-radius: 12px; min-height: 80px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); position: relative; border: 1px solid #f1f5f9; transition: transform .2s;}
  .cal-cell:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.05); }
  .cal-cell .date-num { position: absolute; top: 8px; right: 10px; font-size: 12px; color: var(--muted); font-weight: 600;}
  .cal-sunday { background: linear-gradient(135deg, #fff5f5, #fff); border-color: #fee2e2; }
  .cal-holiday { background: linear-gradient(135deg, #ecfdf5, #fff); border-color: #d1fae5; }
  .cal-today { background: linear-gradient(135deg, #eff6ff, #fff); border-color: #bfdbfe; box-shadow: 0 0 0 2px rgba(59,130,246,0.3); }

  /* Profile Profile */
  .profile-card { display: flex; align-items: center; gap: 12px; padding: 6px; border-radius: 12px; background: rgba(255,255,255,0.7); box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; border: 1px solid rgba(255,255,255,0.9); transition: background .2s;}
  .profile-card:hover { background: rgba(255,255,255,0.9); }
  .profile-card .avatar { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; background: linear-gradient(135deg, #0b63d6, #094eb0); font-size: 16px; }
  .profile-dropdown { position: absolute; right: 18px; top: 70px; padding: 20px; width: 340px; display: none; z-index: 50; flex-direction: column; }
  .profile-dropdown.show { display: flex; animation: slideDown 0.2s ease forwards; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  .profile-dropdown .profile-top { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 12px; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px;}
  .profile-dropdown .profile-top .avatar-large { width: 72px; height: 72px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; background: linear-gradient(135deg, #0b63d6, #094eb0); font-size: 28px; box-shadow: 0 4px 10px rgba(11,99,214,0.2);}
  .profile-dropdown .profile-meta { display: flex; flex-direction: column; gap: 4px; }
  .profile-dropdown .profile-meta .meta { font-size: 13px; color: var(--muted); }
  .profile-dropdown .profile-footer { margin-top: 16px; display: flex; justify-content: flex-end; }

  @media (max-width: 1100px) {
    .form-grid { grid-template-columns: 1fr; }
    .calendar-grid { grid-template-columns: repeat(7, minmax(80px, 1fr)); }
    .header-counts { flex-direction: column; gap: 8px; align-items: stretch; }
    .count-badge { min-width: unset; margin: 0; }
  }
</style>
