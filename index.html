<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b63d6"><title>H &amp; D Logistics — Attendance</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root{--blue:#0b63d6;--ink:#17243a;--muted:#64748b;--bg:#f4f7fb;--line:#e3eaf3;--green:#16a34a;--red:#ef4444;--amber:#f59e0b}*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.layout{min-height:100vh;display:flex}.sidebar{width:245px;background:linear-gradient(180deg,#0b63d6,#094eaa);padding:24px 16px;color:#fff;display:flex;flex-direction:column;gap:25px}.brand{font-size:20px;font-weight:800;padding:0 10px 20px;border-bottom:1px solid #ffffff3d}.nav{display:grid;gap:7px}.nav button{border:0;text-align:left;color:#eaf2ff;background:transparent;padding:12px;border-radius:10px}.nav button:hover,.nav button.active{background:#ffffff24;color:#fff}.logout{margin-top:auto;background:#ffffff20!important}.main{min-width:0;flex:1}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top h1{font-size:19px;margin:0}.who{color:var(--muted)}.content{padding:26px;max-width:1450px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 6px 24px #10274608}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.row>label{min-width:140px;flex:1}.field label{display:block;color:var(--muted);font-size:13px;margin:0 0 6px}.field input,.field select,.row input,.row select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.btn{border:0;background:var(--blue);color:#fff;border-radius:8px;padding:10px 15px;font-weight:650}.btn.secondary{background:#e8eef6;color:#26364e}.btn.danger{background:var(--red)}.btn:disabled{opacity:.55;cursor:wait}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.fields .full{grid-column:1/-1}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;margin-top:12px;white-space:nowrap}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left}th{background:#f8fafc;color:#334155}td input{accent-color:var(--blue)}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:15px}.toolbar .field{min-width:140px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);padding:16px;border-radius:12px}.stat span{color:var(--muted)}.stat strong{display:block;font-size:23px;margin-top:8px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(80px,1fr));gap:7px}.day{min-height:90px;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}.day.sun{background:#fff1f1;border-color:#fecaca;color:#b91c1c}.day.hol{background:#e9f9ef;border-color:#a7e4ba}.day .holiday{display:block;margin-top:28px;font-size:11px;white-space:normal;color:#166534}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0b63d6,#14233b);padding:20px}.login-card{width:min(420px,100%);background:#fff;border-radius:18px;padding:30px;box-shadow:0 20px 70px #0003}.login-card h1{margin-top:0}.login-card .field{margin:16px 0}.notice{padding:11px 14px;border-radius:8px;background:#eff6ff;color:#1d4ed8;margin-bottom:14px}.empty{padding:25px;color:var(--muted);text-align:center}.matrix-table td,.matrix-table th{text-align:center;padding:7px;font-size:12px}.matrix-table td:first-child,.matrix-table th:first-child{text-align:left;position:sticky;left:0;background:white}.badge{font-weight:700}.error{color:#b91c1c;margin:12px 0}.chartbox{height:310px;position:relative}
    @media(max-width:850px){.layout{display:block}.sidebar{width:100%;padding:12px;gap:10px}.brand{padding:5px;border:0}.nav{grid-template-columns:repeat(4,1fr)}.nav button{padding:9px 5px;text-align:center;font-size:12px}.logout{margin-top:0}.top{height:56px;padding:0 16px}.content{padding:15px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.nav{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}.fields .full{grid-column:auto}.calendar{grid-template-columns:repeat(7,minmax(40px,1fr));gap:3px}.day{min-height:64px;padding:5px;font-size:12px}.toolbar{align-items:stretch}.toolbar .field{flex:1}.row{align-items:stretch}}
  </style>
</head>
<body>
  <div id="login" class="login"><form id="loginForm" class="login-card"><h1>H &amp; D Logistics</h1><p style="color:#64748b">Sign in to your attendance dashboard</p><div id="loginError" class="error"></div><div class="field"><label for="userId">User ID or email</label><input id="userId" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" style="width:100%">Login</button></form></div>
  <div id="app" class="layout hidden"><aside class="sidebar"><div class="brand">H &amp; D Logistics</div><nav id="nav" class="nav"></nav><button id="logout" class="nav logout">↪ &nbsp; Sign out</button></aside><main class="main"><header class="top"><h1 id="title">Home</h1><span class="who" id="who"></span></header><section id="content" class="content"></section></main></div>
<script>
const API='/api';let token=sessionStorage.getItem('hd_token')||'',currentUser=null,chartRefs=[];const pages=[['home','🏠 Home'],['attendance','📝 Attendance'],['summary','📊 Summary View'],['register','➕ Employee Registration'],['separation','❌ Employee Separation'],['calendar','📅 Calendar'],['reports','📁 Reports']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const res=await fetch(API+path,{...options,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{}),...(options.headers||{})}});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'Request failed');return data}
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function monthControls(id='month'){return `<div class="field"><label>Month</label><select id="${id}">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i===new Date().getMonth()?'selected':''}>${new Date(2000,i,1).toLocaleString('en',{month:'long'})}</option>`).join('')}</select></div><div class="field"><label>Year</label><select id="${id}Year">${Array.from({length:7},(_,i)=>new Date().getFullYear()-3+i).map(y=>`<option ${y===new Date().getFullYear()?'selected':''}>${y}</option>`).join('')}</select></div>`}
function selectedMonth(id='month'){return `${document.getElementById(id+'Year').value}-${String(document.getElementById(id).value).padStart(2,'0')}`}
function navInit(){document.getElementById('nav').innerHTML=pages.map(([p,t])=>`<button data-page="${p}">${t}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));}
function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=currentUser?.name||'';navInit();go('home')}
function loginView(){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;document.getElementById('loginError').textContent='';try{const d=await api('/login',{method:'POST',body:JSON.stringify({userId:document.getElementById('userId').value.trim(),password:document.getElementById('password').value})});token=d.token;currentUser=d.user;sessionStorage.setItem('hd_token',token);showApp()}catch(err){document.getElementById('loginError').textContent=err.message}finally{btn.disabled=false}};
document.getElementById('logout').onclick=()=>{token='';currentUser=null;sessionStorage.removeItem('hd_token');loginView()};
async function go(page){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('title').textContent=pages.find(p=>p[0]===page)?.[1].replace(/^\S+\s/,'')||'Home';chartRefs.forEach(c=>c.destroy());chartRefs=[];const c=document.getElementById('content');c.innerHTML='<div class="card">Loading…</div>';try{if(page==='home')await home(c);if(page==='attendance')await attendance(c);if(page==='summary')await summary(c);if(page==='register')register(c);if(page==='separation')await separation(c);if(page==='calendar')await calendar(c);if(page==='reports')reports(c)}catch(e){c.innerHTML=`<div class="card error">${esc(e.message)}</div>`}}
async function home(c){const month=todayISO().slice(0,7),data=await api('/summary?month='+month),counts={P:0,A:0,L:0,WO:0},daily=data.days.map(()=>({P:0,A:0,L:0,WO:0}));data.matrix.forEach(r=>r.days.forEach((s,i)=>{const k=s==='W/O'||s==='WO'?'WO':s;if(counts[k]!==undefined){counts[k]++;daily[i][k]++}}));c.innerHTML=`<div class="stats">${[['Present',counts.P],['Absent',counts.A],['Leave',counts.L],['Weekly off',counts.WO]].map(x=>`<div class="stat"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><div class="card toolbar">${monthControls('homeMonth')}<button class="btn" id="homeLoad">Load month</button></div><div class="grid"><div class="card"><h3>Daily Status (Combo)</h3><div class="chartbox"><canvas id="combo"></canvas></div></div><div class="card"><h3>Status Distribution (Pie)</h3><div class="chartbox"><canvas id="pie"></canvas></div></div><div class="card"><h3>Present Trend (Line)</h3><div class="chartbox"><canvas id="line"></canvas></div></div><div class="card"><h3>Weekly Status (Bar)</h3><div class="chartbox"><canvas id="bar"></canvas></div></div></div>`;document.getElementById('homeMonth').value=Number(month.slice(5));document.getElementById('homeMonthYear').value=month.slice(0,4);drawHome(data);document.getElementById('homeLoad').onclick=async()=>{const d=await api('/summary?month='+selectedMonth('homeMonth'));drawHome(d)}}
function drawHome(data){chartRefs.forEach(x=>x.destroy());chartRefs=[];const colors=['#16a34a','#ef4444','#f59e0b','#64748b'],labels=['Present','Absent','Leave','Weekly Off'],keys=['P','A','L','WO'];const totals=keys.map(k=>data.matrix.reduce((n,r)=>n+r.days.filter(s=>s===k||(k==='WO'&&s==='WO')).length,0));const daily=data.days.map((_,i)=>keys.map(k=>data.matrix.reduce((n,r)=>n+(r.days[i]===k||k==='WO'&&r.days[i]==='WO'?1:0),0)));const make=(id,type,labels,datasets,extra={})=>{chartRefs.push(new Chart(document.getElementById(id),{type,data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,...extra}}))};make('combo','bar',data.days.map(String),keys.map((k,i)=>({label:labels[i],data:daily.map(x=>x[i]),backgroundColor:colors[i]})).concat([{type:'line',label:'Present trend',data:daily.map(x=>x[0]),borderColor:'#0b63d6'}]));make('pie','doughnut',labels,[{data:totals,backgroundColor:colors}]);make('line','line',data.days.map(String),[{label:'Present',data:daily.map(x=>x[0]),borderColor:colors[0],tension:.3}]);const weeks=Array.from({length:Math.ceil(data.days.length/7)},(_,i)=>daily.slice(i*7,(i+1)*7).reduce((a,r)=>a.map((v,j)=>v+r[j]),[0,0,0,0]));make('bar','bar',weeks.map((_,i)=>'Week '+(i+1)),keys.map((k,i)=>({label:labels[i],data:weeks.map(w=>w[i]),backgroundColor:colors[i]})))}
async function attendance(c){const date=todayISO(),rows=await api('/attendance?date='+date);c.innerHTML=`<div class="card"><div class="toolbar"><div><strong>Attendance for ${date}</strong></div><div class="field"><label>Status for selected employees</label><select id="attStatus"><option value="P">Present</option><option value="A">Absent</option><option value="L">Leave</option><option value="W/O">Weekly Off</option></select></div><button class="btn" id="saveAtt">Save selected</button></div><div class="table-wrap"><table><thead><tr><th><input type="checkbox" id="all"></th><th>Employee ID</th><th>Full Name</th><th>Designation</th><th>Contact</th><th>Email</th><th>Today</th></tr></thead><tbody>${rows.map(e=>`<tr><td><input type="checkbox" class="pick" value="${esc(e.employeeId)}"></td><td>${esc(e.employeeId)}</td><td>${esc(e.fullName)}</td><td>${esc(e.designation)}</td><td>${esc(e.contact)}</td><td>${esc(e.email)}</td><td>${esc(e.status||'Pending')}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">No employees registered.</div>'}</div></div>`;document.getElementById('all').onchange=e=>document.querySelectorAll('.pick').forEach(x=>x.checked=e.target.checked);document.getElementById('saveAtt').onclick=async()=>{const selections=[...document.querySelectorAll('.pick:checked')].map(x=>({employeeId:x.value,status:document.getElementById('attStatus').value}));if(!selections.length)return alert('Select at least one employee.');try{await api('/attendance',{method:'POST',body:JSON.stringify({date,selections})});alert('Attendance saved to Google Sheets.');attendance(c)}catch(e){alert(e.message)}}}
async function summary(c){c.innerHTML=`<div class="card"><div class="toolbar">${monthControls('sumMonth')}<button class="btn" id="loadSummary">Load</button></div><div id="matrix" class="table-wrap"></div></div>`;const load=async()=>{const d=await api('/summary?month='+selectedMonth('sumMonth'));document.getElementById('matrix').innerHTML=`<table class="matrix-table"><thead><tr><th>Employee Name</th>${d.days.map(day=>`<th class="${new Date(d.year,d.month-1,day).getDay()===0?'sun-col':''}">${day}</th>`).join('')}<th>P</th><th>A</th><th>L</th><th>W/O</th></tr></thead><tbody>${d.matrix.map(r=>{const totals=['P','A','L','W/O'].map(s=>r.days.filter(x=>x===s||s==='W/O'&&x==='WO').length);return `<tr><td>${esc(r.fullName)}</td>${r.days.map((s,i)=>`<td class="${new Date(d.year,d.month-1,i+1).getDay()===0?'sun-col':''}">${esc(s)}</td>`).join('')}${totals.map(x=>`<td>${x}</td>`).join('')}</tr>`}).join('')}</tbody></table>`};document.getElementById('sumMonth').value=new Date().getMonth()+1;document.getElementById('sumMonthYear').value=new Date().getFullYear();document.getElementById('loadSummary').onclick=load;await load()}
function register(c){c.innerHTML=`<div class="card"><h2>Register employee</h2><form id="regForm" class="fields"><div class="field"><label>Employee ID *</label><input name="employeeId" required></div><div class="field"><label>Full Name *</label><input name="fullName" required></div><div class="field"><label>Designation</label><input name="designation"></div><div class="field"><label>Joining Date</label><input name="joiningDate" type="date"></div><div class="field"><label>Contact</label><input name="contact"></div><div class="field"><label>Email</label><input name="email" type="email"></div><div class="field"><label>Password *</label><input name="password" type="password" required minlength="8"></div><div class="full"><button class="btn">Submit</button></div></form></div>`;document.getElementById('regForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{await api('/employees',{method:'POST',body:JSON.stringify(data)});alert('Employee saved to Google Sheets.');e.target.reset()}catch(err){alert(err.message)}}}
async function separation(c){const rows=await api('/employees');c.innerHTML=`<div class="card"><div class="toolbar"><div class="field" style="flex:1"><label>Search employee name or ID</label><input id="searchEmp" placeholder="Type a name or employee ID"></div></div><div id="empResults" class="table-wrap"></div></div>`;const render=()=>{const q=document.getElementById('searchEmp').value.toLowerCase();const found=rows.filter(e=>[e.employeeId,e.fullName,e.email,e.designation].some(x=>(x||'').toLowerCase().includes(q)));document.getElementById('empResults').innerHTML=`<table><thead><tr><th>ID</th><th>Full Name</th><th>Designation</th><th>Joining Date</th><th>Contact</th><th>Email</th><th>Action</th></tr></thead><tbody>${found.map(e=>`<tr><td>${esc(e.employeeId)}</td><td>${esc(e.fullName)}</td><td>${esc(e.designation)}</td><td>${esc(e.joiningDate)}</td><td>${esc(e.contact)}</td><td>${esc(e.email)}</td><td><button class="btn danger small" data-id="${esc(e.employeeId)}">Separate</button></td></tr>`).join('')}</tbody></table>${found.length?'':'<div class="empty">No matching employees.</div>'}`;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(!confirm(`Permanently remove ${b.dataset.id} and their attendance records?`))return;try{await api('/employees/'+encodeURIComponent(b.dataset.id),{method:'DELETE'});alert('Employee removed from Google Sheets.');separation(c)}catch(e){alert(e.message)}})};document.getElementById('searchEmp').oninput=render;render()}
async function calendar(c){const holidays=await api('/holidays');c.innerHTML=`<div class="card"><div class="toolbar">${monthControls('calMonth')}<button class="btn" id="loadCal">Show calendar</button></div><div id="calendarGrid"></div></div>`;document.getElementById('calMonth').value=new Date().getMonth()+1;document.getElementById('calMonthYear').value=new Date().getFullYear();const render=()=>{const y=Number(document.getElementById('calMonthYear').value),m=Number(document.getElementById('calMonth').value),first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),map=Object.fromEntries(holidays.map(h=>[h.date,h.name]));let html=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="cal-header">${x}</div>`).join('');for(let i=0;i<first.getDay();i++)html+='<div></div>';for(let d=1;d<=days;d++){const date=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,holiday=map[date];html+=`<div class="day ${new Date(y,m-1,d).getDay()===0?'sun':''} ${holiday?'hol':''}"><strong>${d}</strong>${holiday?`<span class="holiday">${esc(holiday)}</span>`:''}</div>`}document.getElementById('calendarGrid').innerHTML=`<div class="calendar">${html}</div>`};document.getElementById('loadCal').onclick=render;render()}
function reports(c){c.innerHTML=`<div class="card"><h2>Attendance reports</h2><div class="toolbar">${monthControls('repMonth')}<button class="btn" id="csv">Export CSV</button><button class="btn secondary" id="excel">Export Excel</button></div><p style="color:#64748b">Exports use the selected month's attendance summary.</p></div>`;document.getElementById('repMonth').value=new Date().getMonth()+1;document.getElementById('repMonthYear').value=new Date().getFullYear();const exportFile=async excel=>{try{const d=await api('/summary?month='+selectedMonth('repMonth')),head=['Employee ID','Full Name',...d.days,...['Present','Absent','Leave','Weekly Off']];const data=[head,...d.matrix.map(r=>[r.employeeId,r.fullName,...r.days,...['P','A','L','W/O'].map(s=>r.days.filter(x=>x===s||s==='W/O'&&x==='WO').length)])];const text=data.map(row=>row.map(v=>{let s=String(v??'');return excel?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):`"${s.replace(/"/g,'""')}"`}).map(v=>excel?`<td>${v}</td>`:v).join(excel?'':' ,')).join(excel?'</tr><tr>':'\r\n');const content=excel?`<html><meta charset="utf-8"><table>${text}</tr></table></html>`:'\ufeff'+text;const blob=new Blob([content],{type:excel?'application/vnd.ms-excel;charset=utf-8':'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Attendance_${selectedMonth('repMonth')}.${excel?'xls':'csv'}`;a.click();URL.revokeObjectURL(a.href)}catch(e){alert(e.message)}};document.getElementById('csv').onclick=()=>exportFile(false);document.getElementById('excel').onclick=()=>exportFile(true)}
if(token){api('/employees').then(()=>{currentUser={name:'Signed in'};showApp()}).catch(()=>{token='';sessionStorage.removeItem('hd_token');loginView()})}else loginView();
</script>
</body>
</html>
